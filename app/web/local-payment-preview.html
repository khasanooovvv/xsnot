<!doctype html>
<html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>To‘lov kartasi — lokal preview</title>
<link rel="stylesheet" href="/assets/card-payment.css">
<link rel="stylesheet" href="/assets/card-transfer.css">
<link rel="stylesheet" href="/assets/theme.css">
<style>body{margin:0;padding:24px;font:14px system-ui}#premiumSheet{max-width:380px;margin:auto}button{padding:12px;border:1px solid #ffffff30;border-radius:12px;cursor:pointer}.preview-note{text-align:center;color:#aabbd0;margin-bottom:16px}.card-payment{width:min(380px,calc(100% - 24px))}</style>
<body class="theme-dark">
<p class="preview-note">Lokal namuna · haqiqiy to‘lov yaratilmaydi</p>
<div id="premiumSheet"><button class="premium-tier active" data-tier="gold">Gold</button><button class="premium-plan active" data-days="7"><b>7 kun</b> <span class="gold-price">9 900 so‘m</span></button><div class="premium-payments"><button>💳 Kartani ko‘rish</button></div></div>
<script>
let previewOrder;
const previewFetch = window.fetch.bind(window);
const watchedFiles = ['/local-payment-preview.html', '/assets/card-payment.js', '/assets/card-payment.css', '/assets/card-transfer.css', '/assets/theme.css'];
let previousFiles;
async function watchPreview() {
 try {
  const files = await Promise.all(watchedFiles.map(async path => {
   const response = await previewFetch(path, {cache:'no-store'});
   if (!response.ok) throw new Error('Preview server unavailable');
   return response.text();
  }));
  if (previousFiles && files.some((value, index) => value !== previousFiles[index])) {
   location.reload();
   return;
  }
  previousFiles = files;
 } catch { /* Retry when the local server is available again. */ }
 setTimeout(watchPreview, 1000);
}
watchPreview();
window.fetch=async(url,options={})=>{
 if(!String(url).startsWith('/api/card-orders'))throw new Error('Preview faqat namuna uchun');
 if(options.body){const data=JSON.parse(options.body);previewOrder={id:'preview',network:data.network,tier:data.tier,days:data.days,amount:9900,status:'active',remaining:300};}
 return {ok:true,json:async()=>({...previewOrder})};
};
</script>
<script src="/assets/card-payment.js"></script>
<script>document.querySelector('.premium-payments button').click();document.querySelector('.card-payment-primary').click();</script>
</body></html>
