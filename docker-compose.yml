services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pvp_chat
      POSTGRES_USER: pvp
      POSTGRES_PASSWORD: pvp
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  bot:
    build: .
    command: python -m app.bot
    env_file: .env
    depends_on: [postgres, redis]
  admin:
    build: .
    command: uvicorn app.admin:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
volumes:
  postgres_data:
